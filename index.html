<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Good Girl Rewards</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- ========== LOGIN SCREEN ========== -->
  <section id="login-screen" class="screen active">
    <div class="card cute">
      <h1>♡ Good Girl Login ♡</h1>
      <p class="subtitle">be a good puppy…</p>
      <input type="email" id="email" placeholder="username / email" />
      <input type="password" id="password" placeholder="password" />
      <button id="login-btn" class="pink-btn">Log In</button>
      <p id="login-error" class="error"></p>
      <p class="tiny">Admin or Puppy account</p>
    </div>
  </section>

  <!-- ========== PUPPY DASHBOARD ========== -->
  <section id="puppy-dashboard" class="screen">
    <header class="top-bar">
      <h2>Good Girl Wallet</h2>
      <button id="logout-btn" class="tiny-btn">Logout</button>
    </header>

    <div class="points-display">
      <span id="points-value">0</span>
      <span class="label">points</span>
    </div>

    <nav class="tabs">
      <button data-tab="wallet" class="tab active">Wallet</button>
      <button data-tab="calendar" class="tab">Calendar</button>
      <button data-tab="rewards" class="tab">Rewards</button>
    </nav>

    <div id="tab-wallet" class="tab-content active">
      <!-- points history can go here later -->
      <p>You’re doing so well… keep being a good girl.</p>
    </div>

    <div id="tab-calendar" class="tab-content">
      <div id="calendar-container"><!-- simple calendar will live here --></div>
      <div class="legend">
        <span class="dot period"></span> Period
        <span class="dot spicy"></span> Spicy
      </div>
    </div>

    <div id="tab-rewards" class="tab-content">
      <div id="rewards-list"><!-- rendered from Firestore --></div>
    </div>
  </section>

  <!-- ========== ADMIN DASHBOARD ========== -->
  <section id="admin-dashboard" class="screen">
    <header class="top-bar">
      <h2>Admin Panel</h2>
      <button id="logout-btn-admin" class="tiny-btn">Logout</button>
    </header>

    <div class="admin-section">
      <h3>Give Points</h3>
      <input type="number" id="points-to-give" value="1" min="1" />
      <button id="give-points-btn" class="pink-btn">Give Points to Puppy</button>
    </div>

    <div class="admin-section">
      <h3>Manage Rewards</h3>
      <input type="text" id="new-reward-title" placeholder="Reward name (e.g. Pets)" />
      <input type="number" id="new-reward-cost" placeholder="Cost in points" />
      <button id="add-reward-btn" class="pink-btn">Add Reward</button>
      <div id="admin-rewards-list"></div>
    </div>

    <div class="admin-section">
      <h3>Linked Puppy</h3>
      <p id="linked-status">Not linked yet</p>
      <input type="text" id="link-uid" placeholder="Puppy UID (from her account)" />
      <button id="link-account-btn" class="pink-btn">Link Account</button>
    </div>

    <!-- Optional: quick view of her calendar / wallet -->
  </section>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Puppy Rewards</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

    <!-- Background Decorations -->

    <div id="background">

        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>

    </div>

    <!-- Login Screen -->

    <section id="login-screen" class="screen active">

        <div class="logo">

            🩷

            <h1>Puppy Rewards</h1>

            <p>Good girls deserve rewards.</p>

        </div>

        <div class="login-card">

            <input
                id="username"
                type="text"
                placeholder="Username">

            <input
                id="password"
                type="password"
                placeholder="Password">

            <button id="loginBtn">
                Login
            </button>

            <button id="createBtn" class="secondary">
                Create Account
            </button>

        </div>

    </section>

    <!-- Role Selection -->

    <section id="role-screen" class="screen hidden">

        <h2>Who are you?</h2>

        <button class="role-button" id="ownerButton">

            👑

            <span>Owner</span>

        </button>

        <button class="role-button" id="puppyButton">

            🐾

            <span>Puppy</span>

        </button>

    </section>

    <!-- Invite Screen -->

    <section id="invite-screen" class="screen hidden">

        <h2>Link Your Owner</h2>

        <div class="invite-card">

            <div id="inviteCode">

                XXXX-XXXX

            </div>

            <button id="generateCode">

                Generate Invite Code

            </button>

        </div>

    </section>

    <!-- Owner Link Screen -->

    <section id="link-screen" class="screen hidden">

        <h2>Link Your Puppy</h2>

        <input
            id="inviteInput"
            placeholder="Invite Code">

        <button id="linkBtn">

            Link Puppy

        </button>

    </section>

    <!-- Puppy Dashboard -->

    <section id="puppy-dashboard" class="screen hidden">

        <header>

            <h2>

                🩷 Good Girl Wallet

            </h2>

        </header>

        <div class="points-card">

            <span class="points-label">

                Current Points

            </span>

            <span id="pointCount">

                0

            </span>

        </div>

        <nav class="bottom-nav">

            <button>

                🐾

            </button>

            <button>

                📅

            </button>

            <button>

                🎁

            </button>

            <button>

                ⚙️

            </button>

        </nav>

    </section>

    <!-- Owner Dashboard -->

    <section id="owner-dashboard" class="screen hidden">

        <header>

            <h2>

                👑 Owner Dashboard

            </h2>

        </header>

        <div class="admin-buttons">

            <button class="large">

                +1 Point

            </button>

            <button class="large">

                +5 Points

            </button>

            <button class="large">

                +10 Points

            </button>

            <button class="large">

                Rewards

            </button>

            <button class="large">

                Calendar

            </button>

        </div>

        <nav class="bottom-nav">

            <button>

                🐾

            </button>

            <button>

                📅

            </button>

            <button>

                🎁

            </button>

            <button>

                ⚙️

            </button>

        </nav>

    </section>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
